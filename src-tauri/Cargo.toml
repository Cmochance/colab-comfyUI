[package]
name = "colab-comfyui"
description = "ComfyUI on Google Colab, in one desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "colab_comfyui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
colab-comfy-core = { path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-single-instance = "2.4.2"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString"] }
