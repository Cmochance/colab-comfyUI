[package]
name = "colab-comfy-core"
description = "All the logic of colab-comfyUI. The Tauri shell only calls into this crate."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
hex = "0.4.3"
httparse = "1.10.1"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
